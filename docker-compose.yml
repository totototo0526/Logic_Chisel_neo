services:
  db:
    image: postgres:16-alpine
    container_name: logicchisel_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logicchisel
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
